[mgr]
prepend_keymap = [
  { on = "h", run = "leave", desc = "Go to parent" },
  { on = "l", run = "plugin smart-enter", desc = "Smart enter/open" },
  { on = [ "g", "g" ], run = "arrow top", desc = "Go to top" },
  { on = "G", run = "arrow bot", desc = "Go to bottom" },
  { on = [ "y", "y" ], run = "yank", desc = "Yank selected" },
  { on = [ "d", "d" ], run = "remove", desc = "Trash selected" },
  { on = [ "p", "p" ], run = "paste", desc = "Paste yanked" },
  { on = "q", run = [ "plugin save-ratio", "quit" ], desc = "Save layout ratio and quit" },
  { on = "Q", run = [ "plugin save-ratio", "quit" ], desc = "Save layout ratio and quit" },

  { on = "H", run = "hidden toggle", desc = "Toggle hidden files" },
  { on = "f", run = "find --smart", desc = "Find in directory" },
  { on = "F", run = "plugin smart-filter", desc = "Smart filter" },
  { on = "s", run = "search --via=fd", desc = "Search files by name" },
  { on = "S", run = "search --via=rg", desc = "Search files by content" },
  { on = "O", run = "open --hovered", desc = "Open hovered file" },
  { on = "o", run = "open --interactive", desc = "Open with..." },

  # Copy path / filename to clipboard
  { on = "Y", run = "copy path", desc = "Copy absolute path" },
  { on = [ "y", "p" ], run = "copy path", desc = "Copy absolute path" },
  { on = [ "y", "d" ], run = "copy dirname", desc = "Copy directory path" },
  { on = [ "y", "f" ], run = "copy filename", desc = "Copy filename" },
  { on = [ "c", "c" ], run = "copy path", desc = "Copy absolute path" },
  { on = [ "c", "d" ], run = "copy dirname", desc = "Copy directory path" },
  { on = [ "c", "f" ], run = "copy filename", desc = "Copy filename" },
  { on = [ "c", "n" ], run = "copy name_without_ext", desc = "Copy filename without extension" },

  # Bookmarks
  { on = [ "g", "d" ], run = "cd ~/Downloads", desc = "Go downloads" },
  { on = [ "g", "o" ], run = "cd /home/muggle/learn", desc = "Go learn" },
  { on = [ "g", "h" ], run = "cd /home/muggle/hlt", desc = "Go hlt" },
  { on = [ "g", "." ], run = "cd ~/dotfiles", desc = "Go dotfiles" },
  { on = [ "g", "~" ], run = "cd ~", desc = "Go home" },

  { on = [ ",", "m" ], run = "sort mtime", desc = "Sort by mtime" },
  { on = [ ",", "n" ], run = "sort natural", desc = "Sort naturally" },
  { on = [ ",", "s" ], run = "sort size", desc = "Sort by size" },
  { on = [ ",", "g" ], run = "linemode git", desc = "Linemode: git status" },
  { on = [ ",", "t" ], run = "linemode mtime", desc = "Linemode: modified time" },
  { on = [ ",", "r" ], run = "plugin save-ratio", desc = "Save current layout ratio" },
  { on = [ "c", "m" ], run = "plugin chmod", desc = "Chmod selected files" },
  { on = "E", run = 'shell --block "$EDITOR \"$@\""', desc = "Edit selected with $EDITOR" },
  { on = "T", run = 'shell --confirm "if [ -n \\"$TMUX\\" ]; then tmux new-window -c \\"$PWD\\"; else kitty --detach --directory \\"$PWD\\"; fi"', desc = "Open terminal here" },
]
