[mgr]
ratio = [1, 2, 3]
sort_by = "natural"
sort_dir_first = true
show_hidden = false
show_symlink = true
linemode = "git"
scrolloff = 8

[preview]
wrap = "no"
tab_size = 2
image_delay = 80
max_width = 1200
max_height = 1800

[plugin]
prepend_preloaders = [
  { mime = "image/*", run = "image" },
  { mime = "video/*", run = "video" },
  { mime = "application/pdf", run = "pdf" },
]

[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"

[opener]
edit = [
  { run = '$EDITOR %s', block = true, desc = "Edit", for = "unix" },
]
pdf = [
  { run = 'zathura %s', orphan = true, desc = "Zathura", for = "linux" },
]
image = [
  { run = 'imv %s', orphan = true, desc = "Imv", for = "linux" },
]
media = [
  { run = 'mpv %s', orphan = true, desc = "MPV", for = "linux" },
]
office = [
  { run = 'libreoffice %s', orphan = true, desc = "LibreOffice", for = "linux" },
]
ebook = [
  { run = 'foliate %s', orphan = true, desc = "Foliate", for = "linux" },
]
browser = [
  { run = 'firefox %s', orphan = true, desc = "Firefox", for = "linux" },
]
open = [
  { run = 'xdg-open %s', orphan = true, desc = "Open", for = "linux" },
]

[open]
prepend_rules = [
  { mime = "application/pdf", use = "pdf" },
  { mime = "application/epub+zip", use = "ebook" },
  { mime = "text/html", use = "browser" },
  { mime = "application/xhtml+xml", use = "browser" },
  { mime = "image/svg+xml", use = "browser" },
  { mime = "image/*", use = "image" },
  { mime = "audio/*", use = "media" },
  { mime = "video/*", use = "media" },
  { mime = "text/*", use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "application/javascript", use = "edit" },
  { mime = "application/xml", use = "edit" },
  { mime = "inode/x-empty", use = "edit" },
  { url = "*.epub", use = "ebook" },
  { url = "*.html", use = "browser" },
  { url = "*.htm", use = "browser" },
  { url = "*.svg", use = "browser" },
  { url = "*.md", use = "edit" },
  { url = "*.toml", use = "edit" },
  { url = "*.yaml", use = "edit" },
  { url = "*.yml", use = "edit" },
  { url = "*.lua", use = "edit" },
  { url = "*.odt", use = "office" },
  { url = "*.ods", use = "office" },
  { url = "*.odp", use = "office" },
  { url = "*.doc", use = "office" },
  { url = "*.docx", use = "office" },
  { url = "*.xls", use = "office" },
  { url = "*.xlsx", use = "office" },
  { url = "*.ppt", use = "office" },
  { url = "*.pptx", use = "office" },
]
append_rules = [
  { url = "*", use = "open" },
]

[which]
sort_by = "key"
sort_sensitive = false
sort_reverse = false
