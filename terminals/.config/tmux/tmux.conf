# =========================================
# CẤU HÌNH TMUX
# =========================================

# --- Cơ bản ---
set -g default-shell /usr/bin/zsh                 # Dùng zsh làm shell mặc định
set -g default-terminal "tmux-256color"          # Hỗ trợ 256 màu
set -ag terminal-overrides ",xterm-256color:RGB"  # True color cho Neovim
set -g allow-passthrough on                       # Cho phép passthrough escape sequence (preview ảnh yazi)
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g mouse on                                   # Bật chuột (scroll, resize, chọn pane)
set -g set-clipboard on                           # Đồng bộ clipboard qua OSC52 khi terminal hỗ trợ
set -g history-limit 10000                        # Lịch sử scroll dài hơn
set -g base-index 1                               # Đánh số window từ 1 (thay vì 0)
set -g pane-base-index 1                          # Đánh số pane từ 1
set -g renumber-windows on                        # Tự động đánh lại số khi đóng window
set -s escape-time 10                             # Delay nhỏ để phân biệt Esc và Alt (10ms là đủ)
set -g focus-events on                            # Gửi focus events cho Neovim
set -g xterm-keys on

# --- Đổi prefix từ Ctrl+b sang Ctrl+a (dễ bấm hơn) ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Prefix + b: ẩn/hiện status bar tmux
bind b if-shell -F '#{==:#{status},on}' 'set -g status off' 'set -g status on'

# --- Split window (trực quan: | hoặc \ chia dọc, - chia ngang, luôn tại thư mục hiện tại) ---
bind \\ split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Hoán đổi vị trí panes
bind > swap-pane -D
bind < swap-pane -U

# --- Di chuyển giữa panes (Smart switching phối hợp với Neovim) ---
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf|agy)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n C-\\ if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

# Cứu lệnh clear screen của shell (Prefix + C-l) do vim-tmux-navigator chiếm C-l
bind C-l send-keys 'C-l'

# --- Tích hợp FZF (Floating Popup hiện đại) ---
# Prefix + f: Mở popup tìm kiếm & chuyển Session / Project (tmux-sessionizer)
bind f display-popup -E -w 75% -h 60% "tmux-sessionizer"

# Prefix + s: Mở popup chọn session đang chạy bằng fzf
bind s display-popup -E -w 60% -h 45% "\
    tmux list-sessions -F '#{session_name}' | \
    fzf --reverse --border=rounded --prompt='Session > ' | \
    xargs -r tmux switch-client -t"

# Prefix + w: Mở popup tìm & nhảy window bằng fzf
bind w display-popup -E -w 65% -h 50% "\
    tmux list-windows -F '#{window_index}: #{window_name} (#{pane_current_command})' | \
    fzf --reverse --border=rounded --prompt='Window > ' | \
    cut -d: -f1 | \
    xargs -r tmux select-window -t"

# --- Quản lý nhanh bằng phím Alt (không cần Prefix) ---
# 1. Quản lý Pane (Chia, Zoom, Đóng)
bind -n M-\\ split-window -h -c "#{pane_current_path}"
bind -n M--  split-window -v -c "#{pane_current_path}"
bind -n M-z  resize-pane -Z
bind -n M-x  kill-pane

# 2. Resize Pane liên tục (Alt + Shift + H/J/K/L)
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# 3. Quản lý & Điều hướng Window
bind -n M-Enter new-window -c "#{pane_current_path}"
bind -n M-[ previous-window
bind -n M-] next-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# --- Quản lý Window & Session (Prefix) ---
# Đảo nhanh giữa 2 window gần nhất (Cực nhanh: Prefix + Space hoặc Prefix + Tab)
bind Space last-window
bind Tab last-window

# Quản lý Window
bind c new-window -c "#{pane_current_path}"        # Prefix + c: tab mới
bind X kill-window                                 # Prefix + X: đóng tab hiện tại
bind x kill-pane                                   # Prefix + x: đóng pane hiện tại
bind r command-prompt -I "#W" "rename-window '%%'" # Prefix + r: đổi tên tab
bind m resize-pane -Z                              # Prefix + m: phóng to/thu nhỏ pane (Zoom)
bind z resize-pane -Z                              # Prefix + z: phóng to/thu nhỏ pane (Zoom)

# Quản lý Session
bind S new-session -c "#{pane_current_path}"       # Prefix + S: session mới tại thư mục hiện tại

# Điều hướng Window & Session lặp lại (-r)
bind -r h previous-window                          # Prefix + h: window trước
bind -r l next-window                              # Prefix + l: window sau
bind -r j switch-client -n                         # Prefix + j: session sau
bind -r k switch-client -p                         # Prefix + k: session trước

# Resize pane lặp lại (-r)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Tiện ích cá nhân với Prefix
bind p split-window -Z "agy-preview"               # Prefix + p: xem câu trả lời agy trong nvim (zoomed)
bind e run-shell "tmux-scrollback '#{pane_id}'"    # Prefix + e: đưa scrollback terminal vào nvim
bind n split-window -Z "nvim-scratch"             # Prefix + n: mở nvim scratchpad tạm

# Reload config (Prefix + R)
unbind R
bind R source-file /home/muggle/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# --- Copy mode (vi style) ---
setw -g mode-keys vi

# Vào copy mode bằng Prefix + [ hoặc Prefix + v (trả lại phím ` cho shell/nvim)
bind [ copy-mode
bind v copy-mode

bind -T copy-mode-vi h send -X cursor-left
bind -T copy-mode-vi j send -X cursor-down
bind -T copy-mode-vi k send -X cursor-up
bind -T copy-mode-vi l send -X cursor-right
bind -T copy-mode-vi / command-prompt -p "search down" "send -X search-forward \"%%\""
bind -T copy-mode-vi ? command-prompt -p "search up" "send -X search-backward \"%%\""
bind -T copy-mode-vi n send -X search-again
bind -T copy-mode-vi N send -X search-reverse
bind -T copy-mode-vi g send -X history-top
bind -T copy-mode-vi G send -X history-bottom

# Lựa chọn: v = bôi đen thông thường, C-v = chọn khối hình chữ nhật (Visual Block)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi 'C-v' send -X rectangle-toggle

# Thoát copy mode: Esc, q hoặc i
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi q send -X cancel
bind -T copy-mode-vi i send -X cancel

# Copy vào clipboard (tự động phát hiện Wayland wl-copy hoặc X11 xclip)
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "if command -v wl-copy >/dev/null 2>&1; then wl-copy 2>/dev/null || xclip -selection clipboard -in; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard -in; else cat >/dev/null; fi"
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "if command -v wl-copy >/dev/null 2>&1; then wl-copy 2>/dev/null || xclip -selection clipboard -in; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard -in; else cat >/dev/null; fi"

# =========================================
# GIAO DIỆN (ROSE PINE)
# =========================================

# default statusbar colors
set -g status on
set -g status-position top
set -g status-justify right
set -g status-interval 60
set-option -g status-style bg=default
set-option -g status-left-length 200
set-option -g status-right-length 200
set-option -g status-left '#{@vim_tabline}'
set-option -g status-right ""
# Khi reload config, bỏ override cục bộ để các session đang tồn tại kế thừa giá trị global.
run-shell -b 'tmux list-sessions -F "##{session_name}" | while IFS= read -r s; do tmux set-option -u -t "$s" status-right; tmux set-option -u -t "$s" status-left; done'

# default window title colors
set-window-option -g window-status-style fg=#9a9a9a,bg=default
set-window-option -g window-status-format " #I:#W "
set-window-option -g window-status-current-format " #I:#W "

# active window title colors
set-window-option -g window-status-current-style fg=#ffffff,bg=default,bold

# pane border
set-option -g pane-border-style fg=#403d52
set-option -g pane-active-border-style fg=#c4a7e7
set -g pane-border-lines single # Đảm bảo dùng viền đơn

# message text
set-option -g message-style fg=#191724,bg=#f6c177

# pane number display
set-option -g display-panes-active-colour colour175
set-option -g display-panes-colour colour180

# bell
set-window-option -g window-status-bell-style fg=#191724,bg=#eb6f92
