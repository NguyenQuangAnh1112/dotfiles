# =========================================
# CẤU HÌNH TMUX
# =========================================

# --- Cơ bản ---
set -g default-terminal "tmux-256color"          # Hỗ trợ 256 màu
set -ag terminal-overrides ",xterm-256color:RGB"  # True color cho Neovim
set -g mouse on                                   # Bật chuột (scroll, resize, chọn pane)
set -g set-clipboard on                           # Đồng bộ clipboard qua OSC52 khi terminal hỗ trợ
set -g history-limit 10000                        # Lịch sử scroll dài hơn
set -g base-index 1                               # Đánh số window từ 1 (thay vì 0)
set -g pane-base-index 1                          # Đánh số pane từ 1
set -g renumber-windows on                        # Tự động đánh lại số khi đóng window
set -s escape-time 10                             # Delay nhỏ để phân biệt Esc và Alt (10ms là đủ)
set -g focus-events on                            # Gửi focus events cho Neovim
set -g xterm-keys on

# --- Đổi prefix từ Ctrl+b sang Ctrl+a (dễ bấm hơn) ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Prefix + b: ẩn/hiện status bar tmux
bind b if-shell -F '#{==:#{status},on}' 'set -g status off' 'set -g status on'

# Prefix + \\: split ngang nếu đang chỉ có 1 pane, ngược lại chuyển pane kế tiếp.
bind \\ if-shell -F '#{==:#{window_panes},1}' 'split-window -h -c "#{pane_current_path}"' 'select-pane -t :.+'
# Prefix + -: split dọc nếu đang chỉ có 1 pane, ngược lại chuyển pane kế tiếp.
bind - if-shell -F '#{==:#{window_panes},1}' 'split-window -v -c "#{pane_current_path}"' 'select-pane -t :.+'
# Force split để tạo thêm pane kể cả khi window đang có nhiều pane.
bind '|' split-window -h -c "#{pane_current_path}"
bind '_' split-window -v -c "#{pane_current_path}"

bind s choose-tree -Zs

unbind '"'
unbind %

# --- Di chuyển giữa panes ---
bind -r Left select-pane -L
bind -r Down select-pane -D
bind -r Up select-pane -U
bind -r Right select-pane -R
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
# --- Tắt các phím Alt/Meta custom ở root table ---
# Dùng -q để reload không báo lỗi nếu key chưa từng được bind.
unbind-key -q -n 'M-h'
unbind-key -q -n 'M-j'
unbind-key -q -n 'M-k'
unbind-key -q -n 'M-l'
unbind-key -q -n 'M-H'
unbind-key -q -n 'M-J'
unbind-key -q -n 'M-K'
unbind-key -q -n 'M-L'
unbind-key -q -n M-\\
unbind-key -q -n 'M--'
unbind-key -q -n 'M-z'
unbind-key -q -n 'M-c'
unbind-key -q -n 'M-d'
unbind-key -q -n 'M-x'
unbind-key -q -n 'M-t'
unbind-key -q -n 'M-<'
unbind-key -q -n 'M->'
unbind-key -q -n 'M-,'
unbind-key -q -n 'M-.'
unbind-key -q -n 'M-/'
unbind-key -q -n 'M-p'
unbind-key -q -n 'M-n'
unbind-key -q -n 'M-w'
unbind-key -q -n 'M-1'
unbind-key -q -n 'M-2'
unbind-key -q -n 'M-3'
unbind-key -q -n 'M-4'
unbind-key -q -n 'M-5'
unbind-key -q -n 'M-6'
unbind-key -q -n 'M-7'
unbind-key -q -n 'M-8'
unbind-key -q -n 'M-9'

bind-key -n C-\\ if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

# --- Chuyển Window bằng phím F1..F9 ---
bind -n F1 select-window -t 1
bind -n F2 select-window -t 2
bind -n F3 select-window -t 3
bind -n F4 select-window -t 4
bind -n F5 select-window -t 5
bind -n F6 select-window -t 6
bind -n F7 select-window -t 7
bind -n F8 select-window -t 8
bind -n F9 select-window -t 9

# --- Điều hướng/resize với Prefix + hjkl / HJKL ---
bind -r h previous-window                          # Prefix + h: window trước (repeatable)
bind -r l next-window                              # Prefix + l: window kế tiếp (repeatable)
bind Tab last-window                               # Prefix + Tab: quay lại window trước đó
bind -r j switch-client -n                         # Prefix + j: session kế tiếp (repeatable)
bind -r k switch-client -p                         # Prefix + k: session trước (repeatable)
bind , switch-client -p                            # Prefix + ,: session trước
bind . switch-client -n                            # Prefix + .: session kế tiếp
bind -r H resize-pane -L 5                         # Prefix + H: resize pane sang trái
bind -r J resize-pane -D 5                         # Prefix + J: resize pane xuống dưới
bind -r K resize-pane -U 5                         # Prefix + K: resize pane lên trên
bind -r L resize-pane -R 5                         # Prefix + L: resize pane sang phải
bind m resize-pane -Z                              # Prefix + m: phóng to/thu nhỏ pane hiện tại

# --- Window management ---
bind c new-window -c "#{pane_current_path}"        # Prefix + c: tab mới
bind n new-session -c "#{pane_current_path}"       # Prefix + n: session mới tại thư mục hiện tại
bind X kill-window                                 # Prefix + X: đóng tab
# Các phím Prefix + số (1-9) đã được tmux hỗ trợ mặc định để chuyển window, ta chỉ cần Prefix + 1, 2...

# --- Reload config ---
unbind r
bind r source-file /home/muggle/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# --- Copy mode (vi style) ---
setw -g mode-keys vi
unbind -n Escape
unbind -T copy-mode Escape
unbind -T copy-mode-vi Escape
bind -n ` copy-mode
bind -T copy-mode-vi h send -X cursor-left
bind -T copy-mode-vi j send -X cursor-down
bind -T copy-mode-vi k send -X cursor-up
bind -T copy-mode-vi l send -X cursor-right
bind -T copy-mode-vi / command-prompt -p "search down" "send -X search-forward \"%%\""
bind -T copy-mode-vi ? command-prompt -p "search up" "send -X search-backward \"%%\""
bind -T copy-mode-vi n send -X search-again
bind -T copy-mode-vi N send -X search-reverse
bind -T copy-mode-vi g send -X history-top
bind -T copy-mode-vi G send -X history-bottom
bind -T copy-mode-vi i send -X cancel
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "if command -v wl-copy >/dev/null 2>&1; then wl-copy 2>/dev/null || xclip -selection clipboard -in; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard -in; else cat >/dev/null; fi"
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "if command -v wl-copy >/dev/null 2>&1; then wl-copy 2>/dev/null || xclip -selection clipboard -in; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard -in; else cat >/dev/null; fi"

# =========================================
# GIAO DIỆN (ROSE PINE)
# =========================================

# default statusbar colors
set -g status on
set -g status-position top
set -g status-justify absolute-centre
set -g status-interval 60
set-option -g status-style bg=default
set-option -g status-left-length 200
set-option -g status-right-length 99
set-option -g status-left ""
set-option -g status-right "#[fg=#9a9a9a]#S-%H:%M"
# Khi reload config, bỏ override cục bộ để các session đang tồn tại kế thừa giá trị global.
run-shell -b 'tmux list-sessions -F "##{session_name}" | while IFS= read -r s; do tmux set-option -u -t "$s" status-right; done'

# default window title colors
set-window-option -g window-status-style fg=#9a9a9a,bg=default
set-window-option -g window-status-format " #I:#W "
set-window-option -g window-status-current-format " #I:#W "

# active window title colors
set-window-option -g window-status-current-style fg=#ffffff,bg=default,bold

# pane border
set-option -g pane-border-style fg=#403d52
set-option -g pane-active-border-style fg=#c4a7e7
set -g pane-border-lines single # Đảm bảo dùng viền đơn

# message text
set-option -g message-style fg=#191724,bg=#f6c177

# pane number display
set-option -g display-panes-active-colour colour175
set-option -g display-panes-colour colour180

# bell
set-window-option -g window-status-bell-style fg=#191724,bg=#eb6f92
